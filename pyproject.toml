[project]
name = "instant-frappuccino"
version = "0.1.0"
description = "Desktop GUI for creating and managing Frappe Manager and Frappe Deployer sites locally."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aryan Kaushik" }]
dependencies = [
    # Essentials = QtCore/Gui/Widgets/Svg/Network without WebEngine & friends (~70MB lighter).
    "PySide6-Essentials>=6.8,<6.10",  # 6.10+ wheels ship macOS-15-only bindings; 6.9 covers macOS 13+
    "platformdirs>=4.2",
    "tomli-w>=1.0",
]

[project.gui-scripts]
instant-frappuccino = "fmapp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "dmgbuild>=1.6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmapp"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/fmapp/ui/theme.py" = ["E501"]  # stylesheet lines read better unwrapped
